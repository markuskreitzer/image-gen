[project]
name = "image-gen"
version = "0.1.0"
description = "Generate images with FLUX.2-klein-4B using Diffusers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "diffusers",
    "protobuf>=7.34.1",
    "sentencepiece>=0.2.1",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=5.4.0",
]

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers.git" }
