[project]
name = "image-gen"
version = "0.1.0"
description = "Generate images with FLUX.2-klein using Diffusers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "diffusers",
    "protobuf>=7.34.1",
    "rich>=14.0.0",
    "sentencepiece>=0.2.1",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=5.4.0",
    "typer>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["image_gen"]

[project.scripts]
imagen = "image_gen.cli:main"

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers.git" }
