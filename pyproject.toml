[project]
name = "image-gen"
version = "0.1.0"
description = "Generate images with FLUX.2-klein on Apple Silicon"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.13.0",
    "diffusers>=0.37.1",
    "rich>=14.0.0",
    "torch>=2.11.0",
    "transformers>=5.4.0",
    "typer>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
imagen = "main:app"
